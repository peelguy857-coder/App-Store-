<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Notes</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:system-ui,sans-serif;background:#fefce8;color:#1c1917;display:flex;flex-direction:column}
  header{display:flex;gap:8px;padding:12px;background:#fde047;align-items:center}
  h1{font-size:18px;margin:0 auto 0 4px}
  input{flex:1;font:inherit;padding:10px 12px;border:0;border-radius:10px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:#1c1917;color:#fff;cursor:pointer}
  main{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));align-content:start}
  .note{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 6px #0001;display:flex;flex-direction:column;gap:8px}
  textarea{border:0;resize:vertical;min-height:90px;font:inherit;outline:none;background:transparent}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:#78716c}
  .meta button{background:none;color:#dc2626;padding:0}
  .empty{grid-column:1/-1;text-align:center;color:#78716c;margin-top:40px}
</style></head><body>
<header><h1>📝 Quick Notes</h1></header>
<header style="background:#fef08a"><input id="q" placeholder="Search notes…"><button id="add">+ New</button></header>
<main id="list"></main>
<script>
const KEY='quick-notes';
let notes=JSON.parse(localStorage.getItem(KEY)||'[]');
const save=()=>localStorage.setItem(KEY,JSON.stringify(notes));
const list=document.getElementById('list'),q=document.getElementById('q');
function render(){
  const term=q.value.toLowerCase();list.innerHTML='';
  const shown=notes.filter(n=>n.text.toLowerCase().includes(term));
  if(!shown.length){list.innerHTML='<p class="empty">'+(notes.length?'No matches.':'No notes yet — tap “+ New”. Notes are saved automatically.')+'</p>';return}
  for(const n of shown){
    const d=document.createElement('div');d.className='note';
    const t=document.createElement('textarea');t.value=n.text;t.placeholder='Write something…';
    t.oninput=()=>{n.text=t.value;n.at=Date.now();save();time.textContent=new Date(n.at).toLocaleString()};
    const m=document.createElement('div');m.className='meta';
    const time=document.createElement('span');time.textContent=new Date(n.at).toLocaleString();
    const del=document.createElement('button');del.textContent='Delete';
    del.onclick=()=>{notes=notes.filter(x=>x!==n);save();render()};
    m.append(time,del);d.append(t,m);list.append(d);
  }
}
document.getElementById('add').onclick=()=>{notes.unshift({text:'',at:Date.now()});save();q.value='';render();list.querySelector('textarea').focus()};
q.oninput=render;render();
</script></body></html>
